<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXPASS - Criar Conta</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400;500;800&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <h2>Crie sua Conta</h2>
            
            <form action="/cadastro" method="POST" class="auth-form">
                <div class="input-group">
                    <label for="name">Nome Completo</label>
                    <input type="text" id="name" name="nome" placeholder="Seu nome aqui" required>
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="email@exemplo.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="senha" placeholder="Sua senha" required>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar Senha</label>
                    <input type="password" id="confirm-password" placeholder="Repita a senha" required>
                </div>

                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Lembrar-me</label>
                </div>

                <button type="submit" class="btn-primary btn-block">Criar Conta</button>
            </form>

            <p class="auth-footer">
                 Já tem uma conta? <a href="/login">Login</a>
            </p>

            <div class="divider">
                <span>ou</span>
            </div>

            <div class="social-auth">
                <button type="button" class="btn-social">
                    <img src="https://www.google.com/favicon.ico" alt="Google" width="18">
                    Continuar com Google
                </button>
                <button type="button" class="btn-social">
                    <i data-lucide="apple" class="icon-small"></i>
                    Continuar com Apple
                </button>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
